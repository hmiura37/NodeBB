<script>
    /*
     * Dialogs (donate + about) for the brand header.
     *
     * Guarded so it initialises only once per page session, and all opening /
     * closing is done via delegated document listeners. This means the handlers
     * never stack if NodeBB re-renders the header widget on ajaxify navigation,
     * and the modals still open even when the buttons are replaced by a re-render.
     */
    (function initBrandHeaderDialogs() {
        if (window.__nbBrandHeaderInit) {
            return;
        }
        window.__nbBrandHeaderInit = true;

        var $ = window.jQuery;

        function showModal(modalSelector) {
            var modalElement = document.querySelector(modalSelector);

            if (!modalElement) {
                return;
            }

            if (window.bootstrap && window.bootstrap.Modal) {
                window.bootstrap.Modal.getOrCreateInstance(modalElement).show();
                return;
            }

            if ($ && $.fn && $.fn.modal) {
                $(modalElement).modal('show');
                return;
            }

            modalElement.style.display = 'block';
            modalElement.removeAttribute('aria-hidden');
            modalElement.setAttribute('aria-modal', 'true');
            modalElement.classList.add('show');
            document.body.classList.add('modal-open');
        }

        function hideModal(modalElement) {
            if (!modalElement) {
                return;
            }

            if (window.bootstrap && window.bootstrap.Modal) {
                var bootstrapModal = window.bootstrap.Modal.getInstance(modalElement);
                if (bootstrapModal) {
                    bootstrapModal.hide();
                }
            } else if ($ && $.fn && $.fn.modal) {
                $(modalElement).modal('hide');
            }

            // Fallback cleanup. This also fixes cases where the Bootstrap/jQuery
            // modal API exists but does not fully clean up inside a widget block.
            setTimeout(function () {
                modalElement.classList.remove('show');
                modalElement.style.display = 'none';
                modalElement.setAttribute('aria-hidden', 'true');
                modalElement.removeAttribute('aria-modal');

                document.querySelectorAll('.modal-backdrop').forEach(function (backdrop) {
                    backdrop.remove();
                });

                if (!document.querySelector('.modal.show')) {
                    document.body.classList.remove('modal-open');
                    document.body.style.removeProperty('padding-right');
                    document.body.style.removeProperty('overflow');
                }
            }, 150);
        }

        // Tooltip on the donate button. Safe to re-run; we attach it once on
        // load and again after each ajaxify render in case the button is new.
        function initDonateTooltip() {
            var donateBtn = document.querySelector('#nb-donate-btn');
            if (donateBtn && $ && $.fn && $.fn.tooltip) {
                $(donateBtn).tooltip({ placement: 'bottom', trigger: 'hover' });
            }
        }
        initDonateTooltip();
        if ($) {
            $(window).on('action:ajaxify.end', initDonateTooltip);
        }

        // Single delegated click handler: opens donate / about, handles Stripe,
        // and handles all close affordances.
        document.addEventListener('click', function (e) {
            // Open donate
            var donateBtn = e.target.closest('#nb-donate-btn');
            if (donateBtn) {
                if ($ && $.fn && $.fn.tooltip) {
                    $(donateBtn).tooltip('hide');
                }
                showModal('#nb-donate-modal');
                return;
            }

            // Open about
            if (e.target.closest('#nb-total-patients')) {
                showModal('#nb-about-modal');
                return;
            }

            // Stripe link: let it open, then close the modal afterwards
            if (e.target.closest('#nb-stripe-link')) {
                setTimeout(function () {
                    hideModal(document.querySelector('#nb-donate-modal'));
                }, 0);
                return;
            }

            // Close buttons
            var closeButton = e.target.closest('[data-dismiss="modal"], [data-bs-dismiss="modal"]');
            if (closeButton) {
                e.preventDefault();
                hideModal(closeButton.closest('.modal'));
                return;
            }

            // Click on backdrop area
            if (e.target.classList && e.target.classList.contains('modal')) {
                hideModal(e.target);
            }
        });

        // Keyboard activation for the about trigger (Enter / Space).
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter' && e.key !== ' ') {
                return;
            }
            var trigger = e.target.closest && e.target.closest('#nb-total-patients');
            if (trigger) {
                e.preventDefault();
                showModal('#nb-about-modal');
            }
        });
    })();
</script>
