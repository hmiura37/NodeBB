<div id="nb-ai-chat-app" class="nb-ai-chat-app">
  <div class="ai-agent-banner">
    <div id="typewriter-msg1" class="ai-agent-page-top-msg" data-text="🕵️ AI Agent を選択すると、このサイトの投稿内容から回答を生成します。"></div>
    <div id="typewriter-msg2" class="ai-agent-page-top-msg2" data-text="　　（ 只今、医療専用生成AIのAPIを準備中、暫くお待ちください ）"></div>
  </div>

  <div id="nb-ai-chat-log" class="nb-ai-chat-log"></div>

  <form id="nb-ai-chat-form" class="nb-ai-chat-form">
    <textarea
      class="nb-ai-input"
      rows="3"
      placeholder="AI に質問？（ 送信：⌘ + ↵  ）"
    ></textarea>
    <div class="nb-ai-form-footer">
      <span id="nb-ai-char-count" class="nb-ai-char-count">0 / 2000</span>

      <button type="button" class="nb-ai-info-btn" id="nb-ai-info-btn" title="使い方">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </button>

      <div class="nb-ai-info-popover" id="nb-ai-info-popover" hidden>
        <strong>使い方 / How to use</strong>
        <ul>
          <li>🕵️ AI Agent が投稿を分析して回答</li>
          <li>キー操作＜Ctrl + Enter＞で送信 </li>
          <li>入力文字、最大 2,000 文字😞</li>
          <li>AI モデル、好みで選択できます</li>
          <li>応答内容、最大 1,000 トークン</li>
          <li>フリーモデル、応答に時間が・・・</li>
          <li>十分な寄付で、AI 応答速度🔝</li>
        </ul>
      </div>

      <span class="nb-ai-model-label">Model:</span>
      <div class="nb-ai-model-select-wrap">
        <select id="nb-ai-model-select" class="nb-ai-model-select">
            <option value="agent">🕵️ AI Agent</option>
            <option value="h">🔴 OpenRouter (free)</option>
            <option value="g">🟢 Nvidia (free)</option>
            <option value="d">✨ Gemma (free)</option>
            <option value="c">🦙 Meta (free)</option>
            <option value="f">🟣 Qwen (free)</option>
            <option value="e">🧠 DeepSeek</option>
            <option value="b">🟠 Claude</option>
            <option value="a">🔘 GPT</option>
        </select>
        <span class="nb-ai-model-arrow">▾</span>
      </div>

      <button type="submit" class="nb-ai-send-btn">
        <span class="nb-ai-send-text">Send</span>
        <span class="nb-ai-send-icon">➜</span>
      </button>
    </div>
  </form>
</div>

<script>
(function () {
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /**
   * Sequential Multi-line Typewriter Engine
   */
  function runTypewriterEffect() {
    const el1 = document.getElementById('typewriter-msg1');
    const el2 = document.getElementById('typewriter-msg2');
    
    if (!el1 || !el2 || el1.dataset.typingStarted === '1') return;
    el1.dataset.typingStarted = '1';

    const text1 = el1.dataset.text || '';
    const text2 = el2.dataset.text || '';
    
    el1.textContent = '';
    el2.textContent = '';
    
    let index1 = 0;
    let index2 = 0;
    const speed = 45; // Typing speed per character (ms)

    function typeLine1() {
      if (index1 < text1.length) {
        el1.textContent += text1.charAt(index1);
        index1++;
        setTimeout(typeLine1, speed);
      } else {
        setTimeout(typeLine2, 200); // Small natural pause before line 2 starts
      }
    }

    function typeLine2() {
      if (index2 < text2.length) {
        el2.textContent += text2.charAt(index2);
        index2++;
        setTimeout(typeLine2, speed);
      }
    }

    typeLine1();
  }

  /**
   * Minimal Markdown renderer for AI replies.
   */
  function renderReply(text) {
    const lines = text.split('\n');
    let html = '';
    let inUl = false;
    let tableLines = [];

    function closeLists() {
      if (inUl) { html += '</ul>'; inUl = false; }
    }

    function flushTable() {
      if (!tableLines.length) return;
      html += '<table class="nb-ai-table">';
      tableLines.forEach(function (row, idx) {
        if (/^\|[-| :]+\|$/.test(row.trim())) return;
        const cells = row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|');
        const tag = idx === 0 ? 'th' : 'td';
        html += '<tr>' + cells.map(function(c) {
          return '<' + tag + '>' + inline(c.trim()) + '</' + tag + '>';
        }).join('') + '</tr>';
      });
      html += '</table>';
      tableLines = [];
    }

    function inline(str) {
      return escapeHtml(str)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g,       '<em>$1</em>')
        .replace(/`(.+?)`/g,           '<code>$1</code>');
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const trimmed = line.trim();

      if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
        closeLists();
        tableLines.push(trimmed);
        continue;
      } else {
        flushTable();
      }

      const hMatch = trimmed.match(/^(#{1,3})\s+(.+)/);
      if (hMatch) {
        closeLists();
        const level = hMatch[1].length + 2;
        html += '<h' + level + ' class="nb-ai-heading">' + inline(hMatch[2]) + '</h' + level + '>';
        continue;
      }

      const bulletMatch = trimmed.match(/^[-*]\s+(.+)/);
      if (bulletMatch) {
        if (!inUl) { html += '<ul class="nb-ai-bullets">'; inUl = true; }
        html += '<li>' + inline(bulletMatch[1]) + '</li>';
        continue;
      }

      if (!trimmed) {
        closeLists();
        continue;
      }

      closeLists();
      html += '<p>' + inline(trimmed) + '</p>';
    }

    closeLists();
    flushTable();
    return html;
  }

  function scrollToBottom(log) {
    log.scrollTop = log.scrollHeight;
  }

  function getUsername() {
    if (window.app && window.app.user && window.app.user.username) {
      return window.app.user.username;
    }
    if (window.config && window.config.user && window.config.user.username) {
      return window.config.user.username;
    }
    return 'anonymous';
  }

  function getUserId() {
    if (window.app && window.app.user && window.app.user.uid) {
      return window.app.user.uid;
    }
    if (window.config && window.config.user && window.config.user.uid) {
      return window.config.user.uid;
    }
    return 0;
  }

  function initAiChatPage() {
    const app  = document.querySelector('#nb-ai-chat-app');
    const form = document.querySelector('#nb-ai-chat-form');
    const log  = document.querySelector('#nb-ai-chat-log');

    if (!app || !form || !log || app.dataset.initialized === '1') {
      return;
    }

    app.dataset.initialized = '1';
    runTypewriterEffect();

    const textarea  = form.querySelector('.nb-ai-input');
    const button    = form.querySelector('.nb-ai-send-btn');
    const charCount = document.querySelector('#nb-ai-char-count');
    const infoBtn   = document.querySelector('#nb-ai-info-btn');
    const infoPop   = document.querySelector('#nb-ai-info-popover');

    const modelSelect = document.querySelector('#nb-ai-model-select');
    let selectedModel = modelSelect ? modelSelect.value : 'agent';

    if (modelSelect) {
      modelSelect.addEventListener('change', function () {
        selectedModel = modelSelect.value;
      });
    }

    infoBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      infoPop.hidden = !infoPop.hidden;
    });
    
    document.addEventListener('click', function () {
      if (infoPop) infoPop.hidden = true;
    });

    textarea.addEventListener('input', function () {
      const len = textarea.value.length;
      charCount.textContent = len + ' / 2000';
      charCount.classList.toggle('nb-ai-char-over', len > 2000);
    });

    textarea.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        form.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const message = textarea.value.trim();
      if (!message) return;

      if (message.length > 2000) {
        charCount.classList.add('nb-ai-char-over');
        textarea.focus();
        return;
      }

      button.disabled = true;
      button.querySelector('.nb-ai-send-text').textContent = 'Sending...';

      const userBubble = document.createElement('div');
      userBubble.className = 'nb-ai-message nb-ai-message-user';
      const isShort = message.length < 60;
      userBubble.innerHTML =
        '<div class="nb-ai-reply nb-ai-reply-user' + (isShort ? ' nb-ai-reply-compact' : '') + '">'
        + escapeHtml(message) + '</div>';
      log.appendChild(userBubble);

      const botBubble = document.createElement('div');
      botBubble.className = 'nb-ai-message nb-ai-message-bot';
      botBubble.innerHTML =
        '<div class="nb-ai-reply nb-ai-reply-loading"><span></span><span></span><span></span></div>';
      log.appendChild(botBubble);

      scrollToBottom(log);

      textarea.value = '';
      charCount.textContent = '0 / 2000';

      try {
        const response = await fetch('/api/ai-chat/message', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': window.config && window.config.csrf_token ? window.config.csrf_token : ''
          },
          body: JSON.stringify({
            message: message,
            model: selectedModel,
            username: getUsername(),
            uid: getUserId()
          })
        });

        if (!response.ok) {
            let errText = 'Server error: ' + response.status;
            try {
                const errData = await response.json();
                if (errData.error) errText = errData.error;
            } catch (e) {}
            throw new Error(errText);
        }
        
        const data = await response.json();
        const replyText = data.reply || 'AI chat backend is not ready yet.';
        const sources = Array.isArray(data.sources) ? data.sources : [];

        let replyHtml = '<div class="nb-ai-reply">' + renderReply(replyText);

        if (sources.length > 0) {
          replyHtml += '<div class="nb-ai-sources">';
          replyHtml += '<span class="nb-ai-sources-label">📌 参考トピック:</span>';
          replyHtml += '<ul class="nb-ai-sources-list">';
          sources.forEach(function (src) {
            var title = escapeHtml(src.title || '(no title)');
            var url = src.url || ('/topic/' + src.tid);
            replyHtml += '<li><a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer" class="nb-ai-source-link">'
              + title + ' ↗</a></li>';
          });
          replyHtml += '</ul></div>';
        }

        replyHtml += '</div>';
        botBubble.innerHTML = replyHtml;

      } catch (err) {
        botBubble.innerHTML = '<div class="nb-ai-reply nb-ai-reply-error">送信に失敗しました: ' + escapeHtml(err.message) + '</div>';
      } finally {
        button.disabled = false;
        button.querySelector('.nb-ai-send-text').textContent = 'Send';
        scrollToBottom(log);
        textarea.focus();
      }
    });
  }

  initAiChatPage();

  if (window.jQuery) {
    jQuery(window).on('action:ajaxify.end', initAiChatPage);
  }

  document.addEventListener('DOMContentLoaded', initAiChatPage);
})();
</script>
